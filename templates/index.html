<!DOCTYPE html>
<html>

<head>
    <title>Student Performance Predictor</title>

    <style>

        body {
            background-color: #0f172a;
            font-family: 'Times New Roman';
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 15px;
            width: 400px;
            box-shadow: 0px 0px 20px cyan;
        }

        h1 {
            text-align: center;
            color: cyan;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: cyan;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #22d3ee;
        }

        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 22px;
            color: #7dd3fc;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Student Performance Predictor</h1>

        <form action="/predict" method="POST">

            <label>Study Hours</label>
            <input type="number" name="StudyHours" required>

            <label>Attendance</label>
            <input type="number" name="Attendance" required>

            <label>Previous Marks</label>
            <input type="number" name="PreviousMarks" required>

            <label>Assignments Completed</label>
            <input type="number" name="Assignments" required>

            <button type="submit">Predict</button>

        </form>

        {% if prediction %}

        <div class="result">
            Predicted Marks: {{ prediction }}
        </div>

        {% endif %}

    </div>

</body>

</html>
